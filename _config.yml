# baseurl is the URL path prefix your site is served under. For a GitHub
# Pages project site (username.github.io/repo-name/), set this to your
# repo name with a leading slash, e.g. "/pool" - based on your URL
# (github.io/pool), that's what's set below. If you ever rename the repo,
# update this to match.
#
# Leave it "" instead if you're using a custom domain, or if this repo is
# a user/org root site (named exactly username.github.io).
#
# This used to be auto-detected by the GitHub Actions workflow instead of
# being set here - that's been removed in favor of this explicit value,
# since the auto-detection wasn't landing correctly and a wrong baseurl
# breaks every internal link on the site (which is exactly what you were
# seeing: nav links pointing at the domain root instead of /pool).
baseurl: "/pool"
url: ""

title: "" # set from _data/config.yml at render time (see _layouts/default.html)

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - templates/
  - node_modules
  - vendor
  - "*.gemspec"

# _league_source holds the raw fixtures/report CSVs the plugin reads
# directly - Jekyll ignores underscore-prefixed directories by default,
# same as _data/_layouts/etc, so no explicit exclude is needed for it.
